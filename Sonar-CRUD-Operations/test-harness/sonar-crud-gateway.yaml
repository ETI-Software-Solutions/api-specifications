asyncapi: 3.0.0
info:
  title: ETI Event Gateway - Sonar GraphQL CRUD facade
  version: 1.0.0
  description: 'Generated by build.py from sonar-crud.config.yaml plus the Sonar SDL. Do not hand-edit;
    regenerate and re-run audit.py.


    Payload schemas are external references into https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json,
    which build.py derives from the SDL. The GraphQL schema is therefore never restated inside this document.


    Results are delivered OUT OF BAND. The webhook response renderer binds only DATA, EVENT_ID, RETRY_AFTER,
    ERROR and REQUEST, so the Sonar payload cannot ride back on the HTTP response. Callers correlate on
    correlationId over the result channels.'
defaultContentType: application/json
servers:
  crud-ingress:
    host: '{ingressHost}'
    pathname: /webhooks
    protocol: https
    description: Inbound CRUD requests from ETI provisioning clients.
    variables:
      ingressHost:
        default: gateway.etisoftware.com
  sonar-api:
    host: '{sonarHost}'
    protocol: https
    description: Sonar GraphQL endpoint.
    variables:
      sonarHost:
        default: sonar.etisoftware.com
  results-kafka:
    host: '{kafkaHost}:{kafkaPort}'
    protocol: kafka
    variables:
      kafkaHost:
        default: kafka
      kafkaPort:
        default: '9092'
  callback-http:
    host: '{callbackHost}'
    protocol: https
    description: Client callback sink for CRUD results.
    variables:
      callbackHost:
        default: provisioning.etisoftware.com
channels:
  sonar-crud-in:
    address: /sonar/crud
    servers:
    - $ref: '#/servers/crud-ingress'
    messages:
      AccountRead:
        $ref: '#/components/messages/AccountRead'
      AccountCreate:
        $ref: '#/components/messages/AccountCreate'
      AccountUpdate:
        $ref: '#/components/messages/AccountUpdate'
      AccountDelete:
        $ref: '#/components/messages/AccountDelete'
      AccountServiceRead:
        $ref: '#/components/messages/AccountServiceRead'
      AccountServiceCreate:
        $ref: '#/components/messages/AccountServiceCreate'
      AccountServiceUpdate:
        $ref: '#/components/messages/AccountServiceUpdate'
      AccountServiceDelete:
        $ref: '#/components/messages/AccountServiceDelete'
      InventoryItemRead:
        $ref: '#/components/messages/InventoryItemRead'
      InventoryItemCreate:
        $ref: '#/components/messages/InventoryItemCreate'
      InventoryItemUpdate:
        $ref: '#/components/messages/InventoryItemUpdate'
      InventoryItemDelete:
        $ref: '#/components/messages/InventoryItemDelete'
      IpAssignmentRead:
        $ref: '#/components/messages/IpAssignmentRead'
      IpAssignmentCreate:
        $ref: '#/components/messages/IpAssignmentCreate'
      IpAssignmentUpdate:
        $ref: '#/components/messages/IpAssignmentUpdate'
      IpAssignmentDelete:
        $ref: '#/components/messages/IpAssignmentDelete'
      AccountServiceReadByAccountNumber:
        $ref: '#/components/messages/AccountServiceReadByAccountNumber'
      InventoryItemReadByAccountNumber:
        $ref: '#/components/messages/InventoryItemReadByAccountNumber'
      InventoryItemReadBySerialNumber:
        $ref: '#/components/messages/InventoryItemReadBySerialNumber'
      AccountServiceReadBySerialNumber:
        $ref: '#/components/messages/AccountServiceReadBySerialNumber'
      AccountReadByRange:
        $ref: '#/components/messages/AccountReadByRange'
      AccountServiceReadByRange:
        $ref: '#/components/messages/AccountServiceReadByRange'
      InventoryItemReadByRange:
        $ref: '#/components/messages/InventoryItemReadByRange'
      IpAssignmentReadByRange:
        $ref: '#/components/messages/IpAssignmentReadByRange'
    x-webhook-auth:
      type: hmac-sha256
      secretEnv: SONAR_CRUD_WEBHOOK_SECRET
      signatureHeader: X-Signature-256
      signaturePrefix: sha256=
    x-idempotency-key:
      key: $.correlationId
      ttl: 1h
    x-rate-limit:
      rps: 50
      burst: 100
    x-log-redact:
    - $.variables.input.password
    - $.variables.input.email_address
    - $.variables.input.phone_number
    x-payload-normalization:
      prune-empty-elements: false
    x-webhook-response:
      success:
        status: 200
        contentType: application/json
        body: |
          { "correlationId": "{{ DATA.correlationId }}", "status": "ACCEPTED", "eventId": "{{ EVENT_ID }}" }
      duplicate:
        status: 200
        body: |
          { "correlationId": "{{ DATA.correlationId }}", "status": "DUPLICATE" }
      schemaNoMatch:
        status: 400
        body: |
          { "status": "REJECTED", "reason": "payload matched no declared CRUD action schema" }
      classificationNoMatch:
        status: 400
        body: |
          { "status": "REJECTED", "reason": "unknown action" }
      parseFailure:
        status: 400
        body: |
          { "status": "REJECTED", "reason": "unparseable body" }
      unauthorized:
        status: 401
        body: |
          { "status": "UNAUTHORIZED" }
      rateLimited:
        status: 429
        headers:
          Retry-After: '{{ RETRY_AFTER }}'
        body: |
          { "status": "RATE_LIMITED" }
      error:
        status: 500
        body: |
          { "status": "ERROR", "reason": "{{ ERROR.reason }}" }
    x-classification:
      discriminator: action
      discriminatorType: PROPERTY_VALUE
      matchMode: FIRST
      routes:
        account.read:
          x-routing-rules: '#/components/x-routing-rules/AccountRead-Rules'
        account.create:
          x-routing-rules: '#/components/x-routing-rules/AccountCreate-Rules'
        account.update:
          x-routing-rules: '#/components/x-routing-rules/AccountUpdate-Rules'
        account.delete:
          x-routing-rules: '#/components/x-routing-rules/AccountDelete-Rules'
        account_service.read:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceRead-Rules'
        account_service.create:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceCreate-Rules'
        account_service.update:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceUpdate-Rules'
        account_service.delete:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceDelete-Rules'
        inventory_item.read:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemRead-Rules'
        inventory_item.create:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemCreate-Rules'
        inventory_item.update:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemUpdate-Rules'
        inventory_item.delete:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemDelete-Rules'
        ip_assignment.read:
          x-routing-rules: '#/components/x-routing-rules/IpAssignmentRead-Rules'
        ip_assignment.create:
          x-routing-rules: '#/components/x-routing-rules/IpAssignmentCreate-Rules'
        ip_assignment.update:
          x-routing-rules: '#/components/x-routing-rules/IpAssignmentUpdate-Rules'
        ip_assignment.delete:
          x-routing-rules: '#/components/x-routing-rules/IpAssignmentDelete-Rules'
        account_service.read.byAccountNumber:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceReadByAccountNumber-Rules'
        inventory_item.read.byAccountNumber:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemReadByAccountNumber-Rules'
        inventory_item.read.bySerialNumber:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemReadBySerialNumber-Rules'
        account_service.read.bySerialNumber:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceReadBySerialNumber-Rules'
        account.read.byRange:
          x-routing-rules: '#/components/x-routing-rules/AccountReadByRange-Rules'
        account_service.read.byRange:
          x-routing-rules: '#/components/x-routing-rules/AccountServiceReadByRange-Rules'
        inventory_item.read.byRange:
          x-routing-rules: '#/components/x-routing-rules/InventoryItemReadByRange-Rules'
        ip_assignment.read.byRange:
          x-routing-rules: '#/components/x-routing-rules/IpAssignmentReadByRange-Rules'
      onNoMatch:
        action: publish
        channel: sonar-crud-dlq
        failureType: PAYLOAD_FILTER_NO_MATCH
  sonar-graphql:
    address: /api/graphql
    servers:
    - $ref: '#/servers/sonar-api'
    messages:
      SonarGraphQLRequest:
        $ref: '#/components/messages/SonarGraphQLRequest'
    bindings:
      http:
        headers:
          X-Source-System: eti-event-gateway
          User-Agent: eti-event-gateway/sonar-crud
  sonar-crud-results:
    address: gateway.sonar.crud.results
    servers:
    - $ref: '#/servers/results-kafka'
    messages:
      SonarCrudResult:
        $ref: '#/components/messages/SonarCrudResult'
  sonar-crud-callback:
    address: /callbacks/sonar
    servers:
    - $ref: '#/servers/callback-http'
    messages:
      SonarCrudResult:
        $ref: '#/components/messages/SonarCrudResult'
  sonar-crud-dlq:
    address: gateway.sonar.crud.results.dlq
    servers:
    - $ref: '#/servers/results-kafka'
    messages:
      SonarCrudRejected:
        $ref: '#/components/messages/SonarCrudRejected'
operations:
  onSonarCrudRequest:
    action: receive
    channel:
      $ref: '#/channels/sonar-crud-in'
    bindings:
      http:
        method: POST
    x-ack-style: sync
    x-debug-validation: false
  callSonarGraphql:
    action: send
    channel:
      $ref: '#/channels/sonar-graphql'
  publishCrudResult:
    action: send
    channel:
      $ref: '#/channels/sonar-crud-results'
  postCrudCallback:
    action: send
    channel:
      $ref: '#/channels/sonar-crud-callback'
  publishCrudDlq:
    action: send
    channel:
      $ref: '#/channels/sonar-crud-dlq'
components:
  messages:
    AccountRead:
      name: AccountRead
      title: account read
      summary: query `accounts` -> AccountConnection!
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountReadRequest'
    AccountCreate:
      name: AccountCreate
      title: account create
      summary: mutation `createAccount` -> Account
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountCreateRequest'
    AccountUpdate:
      name: AccountUpdate
      title: account update
      summary: mutation `updateAccount` -> Account
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountUpdateRequest'
    AccountDelete:
      name: AccountDelete
      title: account delete
      summary: mutation `archiveAccount` -> Account
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountDeleteRequest'
    AccountServiceRead:
      name: AccountServiceRead
      title: account_service read
      summary: query `account_services` -> AccountServiceConnection!
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceReadRequest'
    AccountServiceCreate:
      name: AccountServiceCreate
      title: account_service create
      summary: mutation `addServiceToAccount` -> AccountService
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceCreateRequest'
    AccountServiceUpdate:
      name: AccountServiceUpdate
      title: account_service update
      summary: mutation `updateAccountService` -> AccountService
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceUpdateRequest'
    AccountServiceDelete:
      name: AccountServiceDelete
      title: account_service delete
      summary: mutation `deleteAccountService` -> SuccessResponse
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceDeleteRequest'
    InventoryItemRead:
      name: InventoryItemRead
      title: inventory_item read
      summary: query `inventory_items` -> InventoryItemConnection!
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemReadRequest'
    InventoryItemCreate:
      name: InventoryItemCreate
      title: inventory_item create
      summary: mutation `createInventoryItems` -> [InventoryItem]
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemCreateRequest'
    InventoryItemUpdate:
      name: InventoryItemUpdate
      title: inventory_item update
      summary: mutation `updateInventoryItem` -> InventoryItem
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemUpdateRequest'
    InventoryItemDelete:
      name: InventoryItemDelete
      title: inventory_item delete
      summary: mutation `deleteInventoryItem` -> SuccessResponse
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemDeleteRequest'
    IpAssignmentRead:
      name: IpAssignmentRead
      title: ip_assignment read
      summary: query `ip_assignments` -> IpAssignmentConnection!
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IpAssignmentReadRequest'
    IpAssignmentCreate:
      name: IpAssignmentCreate
      title: ip_assignment create
      summary: mutation `createIpAssignment` -> IpAssignment
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IpAssignmentCreateRequest'
    IpAssignmentUpdate:
      name: IpAssignmentUpdate
      title: ip_assignment update
      summary: mutation `updateIpAssignment` -> IpAssignment
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IpAssignmentUpdateRequest'
    IpAssignmentDelete:
      name: IpAssignmentDelete
      title: ip_assignment delete
      summary: mutation `deleteIpAssignment` -> SuccessResponse
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IpAssignmentDeleteRequest'
    AccountServiceReadByAccountNumber:
      name: AccountServiceReadByAccountNumber
      title: account_service.read.byAccountNumber
      summary: Account services for one account number.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceReadByAccountNumberRequest'
    InventoryItemReadByAccountNumber:
      name: InventoryItemReadByAccountNumber
      title: inventory_item.read.byAccountNumber
      summary: Inventory assigned directly to one account number.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemReadByAccountNumberRequest'
    InventoryItemReadBySerialNumber:
      name: InventoryItemReadBySerialNumber
      title: inventory_item.read.bySerialNumber
      summary: One inventory item resolved from a serial number.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemReadBySerialNumberRequest'
    AccountServiceReadBySerialNumber:
      name: AccountServiceReadBySerialNumber
      title: account_service.read.bySerialNumber
      summary: The account service an ONT serial is bound to.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceReadBySerialNumberRequest'
    AccountReadByRange:
      name: AccountReadByRange
      title: account.read.byRange
      summary: Comparison and range predicates over accounts.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountReadByRangeRequest'
    AccountServiceReadByRange:
      name: AccountServiceReadByRange
      title: account_service.read.byRange
      summary: Comparison and range predicates over account_services.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AccountServiceReadByRangeRequest'
    InventoryItemReadByRange:
      name: InventoryItemReadByRange
      title: inventory_item.read.byRange
      summary: Comparison and range predicates over inventory_items.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InventoryItemReadByRangeRequest'
    IpAssignmentReadByRange:
      name: IpAssignmentReadByRange
      title: ip_assignment.read.byRange
      summary: Comparison and range predicates over ip_assignments.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/IpAssignmentReadByRangeRequest'
    SonarGraphQLRequest:
      name: SonarGraphQLRequest
      title: GraphQL request envelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SonarGraphQLRequest'
    SonarCrudResult:
      name: SonarCrudResult
      title: CRUD result envelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SonarCrudResult'
    SonarCrudRejected:
      name: SonarCrudRejected
      title: Dead-lettered request
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
  schemas:
    AccountReadRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountReadRequest
    AccountCreateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountCreateRequest
    AccountUpdateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountUpdateRequest
    AccountDeleteRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountDeleteRequest
    AccountServiceReadRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceReadRequest
    AccountServiceCreateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceCreateRequest
    AccountServiceUpdateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceUpdateRequest
    AccountServiceDeleteRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceDeleteRequest
    InventoryItemReadRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemReadRequest
    InventoryItemCreateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemCreateRequest
    InventoryItemUpdateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemUpdateRequest
    InventoryItemDeleteRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemDeleteRequest
    IpAssignmentReadRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/IpAssignmentReadRequest
    IpAssignmentCreateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/IpAssignmentCreateRequest
    IpAssignmentUpdateRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/IpAssignmentUpdateRequest
    IpAssignmentDeleteRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/IpAssignmentDeleteRequest
    AccountServiceReadByAccountNumberRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceReadByAccountNumberRequest
    InventoryItemReadByAccountNumberRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemReadByAccountNumberRequest
    InventoryItemReadBySerialNumberRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemReadBySerialNumberRequest
    AccountServiceReadBySerialNumberRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceReadBySerialNumberRequest
    AccountReadByRangeRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountReadByRangeRequest
    AccountServiceReadByRangeRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/AccountServiceReadByRangeRequest
    InventoryItemReadByRangeRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/InventoryItemReadByRangeRequest
    IpAssignmentReadByRangeRequest:
      $ref: https://schemas.etisoftware.com/sonar/1.0.0/sonar-crud.schemas.json#/definitions/IpAssignmentReadByRangeRequest
    SonarGraphQLRequest:
      type: object
      required:
      - query
      properties:
        operationName:
          type: string
        query:
          type: string
        variables:
          type:
          - object
          - 'null'
    SonarCrudResult:
      type: object
      required:
      - correlationId
      - action
      - status
      properties:
        correlationId:
          type: string
        action:
          type: string
        status:
          enum:
          - OK
          - ERROR
        traceId:
          type: string
        spanId:
          type: string
        data:
          type:
          - object
          - array
          - 'null'
        errors:
          type:
          - array
          - 'null'
  x-routing-rules:
    AccountRead-Rules:
    - receiveFrom:
        sonar:
          channel: sonar-graphql
          method: POST
          address: ''
          mapping: '#/components/x-mappings/AccountRead-Request'
          headers:
            Authorization: Bearer {{ TOKEN.sonar.accessToken }}
            Content-Type: application/json
            Accept: application/json
            X-Trace-Id: '{{ CONTEXT.traceId }}'
      publishTo:
      - channel: sonar-crud-results
        mapping: '#/components/x-mappings/Sonar-Result-Envelope'
        headers:
          x-correlation-id: '{{ DATA.correlationId }}'
          x-sonar-action: account.read
          x-trace-id: '{{ CONTEXT.traceId }}'
      - channel: sonar-crud-callback
        method: POST
        address: '{{ DATA.callbackPath | default(''/results'') }}'
        mapping: '#/components/x-mappings/Sonar-Result-Envelope'
        headers:
          Content-Type: application/json
          x-correlation-id: '{{ DATA.correlationId }}'
          x-sonar-action: account.read
        resilience:
          retry:
            maxAttempts: 4
            wait: PT0.5S
            exponentialBackoff: true
            backoffMultiplier: 2.0
          circuitBreaker:
            slidingWindowSize: 20
            failureRateThreshold: 50
            waitDurationInOpenState: PT30S
          timeLimiter:
            timeout: PT5S
    AccountCreate-Rules:
    - receiveFrom:
        sonar:
          channel: sonar-graphql
          method: POST
          address: ''
          mapping: '#/components/x-mappings/AccountCreate-Request'
          headers:
            Authorization: Bearer {{ TOKEN.sonar.accessToken }}
            Content-Type: application/json
            Accept: application/json
            X-Trace-Id: '{{ CONTEXT.traceId }}'
      publishTo:
      - channel: sonar-crud-results
        mapping: '#/components/x-mappings/Sonar-Result-Envelope'
        headers:
          x-correlation-id: '{{ DATA.correlationId }}'
          x-sonar-action: account.create
          x-trace-id: '{{ CONTEXT.traceId }}'
      - channel: sonar-crud-callback
        method: POST
        address: '{{ DATA.callbackPath | default(''/results'') }}'
        mapping: '#/components/x-mappings/Sonar-Result-Envelope'
        headers:
          Content-Type: application/json
          x-correlation-id: '{{ DATA.correlationId }}'
          x-sonar-action: account.create
        resilience:
          retry:
            maxAttempts: 4
            wait: PT0.5S
            exponentialBackoff: true
            backoffMultiplier: 2.0
          circuitBreaker:
            slidingWindowSize: 20
            failureRateThreshold: 50
            waitDurationInOpenState: PT30S
          timeLimiter:
            timeout: PT5S
    AccountUpdate-Rules:
    - receiveFrom:
        sonar:
          channel: sonar-graphql
          method: POST
          address: ''
          mapping: '#/components/x-mappings/AccountUpdate-Request'
          headers:
            Authorization: Bearer {{ TOKEN.sonar.accessToken }}
            Content-Type: application/json
            Accept: application/json
            X-Trace-Id: '{{ CONTEXT.traceId }}'
      publishTo:
      - channel: sonar-crud-results
        mapping: '#/components/x-mappings/Sonar-Result-Envelope'
        headers:
          x-correlation-id: '{{ DATA.correlationId }}'
          x-sonar-action: account.update
          x-trace-id: '{{ CONTEXT.traceId }}'
      - channel: sonar-crud-callback
        method: POST
        address: '{{ DATA.callbackPath | default(''/results'') }}'
        mapping: '#/components/x-mappings/Sonar-Result-Envelope'
        headers:
          Content-Type: application/json
          x-correlation-id: '{{ DATA.correlationId }}'
          x-sonar-action: account.update
        resilience:
          retry:
            maxAttempts: 4
            wait: PT0.5S
            exponentialBackoff: true
            backoffMultiplier: 2.0
          circuitBreaker:
            slidingWindowSize: 20
            failureRateThreshold: 50
            waitDurationInOpenState: PT30S
          timeLimiter:
            timeout: PT5S
    AccountDelete-Rules:
    - receiveFrom:
        sonar:
          channel: sonar-graphql
          method: POST
          address: ''
          mapping: '#/components/x-mappings/AccountDelete-Request'
          headers:
            Authorization: Bearer {{ TOKEN.sonar.accessToken }}
            Content-Type: application/json
